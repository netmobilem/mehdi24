<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>{{ app_name }} — رمز اشتراک</title>
<link rel="stylesheet" href="/static/css/titan.css" />
</head>
<body>
<div class="login-shell">
  <div class="card login-card">
    <div class="logo" style="width:48px;height:48px;border-radius:13px;background:linear-gradient(145deg,#2f76ff,#1d397b);display:grid;place-items:center;color:#fff">
      <svg viewBox="0 0 24 24" width="24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2.8 19.2 7v10L12 21.2 4.8 17V7L12 2.8Z"/><path d="M12 7.2v9.6M7.2 9.7 12 12.5l4.8-2.8"/></svg>
    </div>
    <h1>{{ group.name }}</h1>
    <p class="sub">این اشتراک رمزدار است. برای مشاهده‌ی کانفیگ‌ها رمز را وارد کنید.</p>
    {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
    <form method="get" action="/s/{{ token }}">
      <div class="field"><label>رمز اشتراک</label><input type="password" name="pw" autofocus required /></div>
      <button class="btn primary" type="submit" style="justify-content:center">ورود</button>
    </form>
  </div>
</div>
</body>
</html>
